<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upload — Sadhana APPSC</title>
  <meta name="description" content="Paste APPSC quiz questions as JSON, review them as editable cards, and push them into the Google Sheets question bank.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="shared.css">
</head>
<body>
  <!-- shared.js injects the navigation bar and the sign-in gate above #pageRoot -->
  <div class="app-container">

    <!-- Hidden until a curator is signed in -->
    <main id="pageRoot" class="main-content" style="display:none">

      <!-- ================================================================
           LEFT: JSON input and the metadata applied across the batch
           ================================================================ -->
      <section class="input-panel">
        <div class="panel-header">
          <h2 class="panel-title">Paste JSON Questions</h2>
          <button id="sampleBtn" class="btn btn-sm btn-ghost" title="Load a sample APPSC question batch">
            Load Sample JSON
          </button>
        </div>

        <!-- Batch defaults. Anything left blank here can still be set per card. -->
        <div class="meta-fields">
          <div class="field-group">
            <label for="subjectSelect">Target Subject</label>
            <select id="subjectSelect" class="field-select"></select>
          </div>
          <div class="field-group">
            <label for="defaultDate">Default Date</label>
            <input type="text" id="defaultDate" class="field-input" placeholder="e.g. 05-09-2026">
          </div>
          <div class="field-group">
            <label for="defaultNewspaper">Default Newspaper</label>
            <input type="text" id="defaultNewspaper" class="field-input" placeholder="e.g. The Hindu">
          </div>
          <div class="field-group">
            <label for="defaultTopic">Default Topic</label>
            <input type="text" id="defaultTopic" class="field-input" placeholder="e.g. Biodiversity">
          </div>
          <div class="field-group">
            <label for="defaultDifficulty">Default Difficulty</label>
            <select id="defaultDifficulty" class="field-select"></select>
          </div>
          <div class="field-group">
            <label for="defaultStatus">Default Status</label>
            <select id="defaultStatus" class="field-select"></select>
          </div>
          <div class="field-group">
            <label for="defaultTags">Default Tags</label>
            <input type="text" id="defaultTags" class="field-input" placeholder="comma, separated, keywords">
          </div>
          <div class="field-group">
            <label for="defaultSourceUrl">Default Source URL</label>
            <input type="text" id="defaultSourceUrl" class="field-input" placeholder="https://…">
          </div>
        </div>

        <textarea id="jsonInput" class="json-textarea" spellcheck="false"
                  placeholder='Paste your questions JSON here…

Either an object with a questions array:
{
  "subject": "Environment",
  "date": "05-09-2026",
  "newspaper": "The Hindu",
  "questions": [
    {
      "question": "Question text here?",
      "option_a": "1 and 2 only",
      "option_b": "2 and 3 only",
      "option_c": "1 and 3 only",
      "option_d": "1, 2 and 3",
      "correct_answer": "D",
      "explanation": "Detailed explanation here.",
      "topic": "Biodiversity",
      "difficulty": "Medium",
      "tags": "wetlands, ramsar"
    }
  ]
}

…or a plain array of question objects.'></textarea>

        <div class="action-buttons">
          <button id="parseBtn" class="btn btn-primary" title="Parse the JSON into editable cards">
            🔍 Parse &amp; Preview
          </button>
          <button id="clearBtn" class="btn btn-ghost" title="Clear the input and all cards">
            Clear All
          </button>
        </div>

        <div id="parseError" class="error-box" style="display:none"></div>
      </section>

      <!-- ================================================================
           RIGHT: editable question cards
           ================================================================ -->
      <section class="cards-panel">
        <div class="cards-header">
          <div class="cards-header-info">
            <h2 class="panel-title">Question Cards <span id="cardCount" class="card-count">(0)</span></h2>
            <span class="panel-subtitle">Edit anything before sending &bull; click a radio to set the correct answer</span>
          </div>
          <div style="display:flex;gap:10px;align-items:center">
            <label class="hint-text" style="display:flex;align-items:center;gap:6px" title="Skip questions whose text already exists anywhere in the bank">
              <input type="checkbox" id="skipDuplicates" checked>
              Skip duplicates
            </label>
            <button id="sendToSheetBtn" class="btn btn-send" disabled title="Push all cards to the Google Sheets question bank">
              🚀 Send to Sheet
            </button>
          </div>
        </div>

        <div id="cardsContainer" class="cards-container vertical-flow"></div>
      </section>

    </main>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
