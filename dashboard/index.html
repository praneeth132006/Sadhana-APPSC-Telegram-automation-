<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upload — Sadhana APPSC</title>
  <meta name="description" content="Paste APPSC quiz questions as JSON, review them as editable cards, and push them into the Google Sheets question bank.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="shared.css">
</head>
<body>
  <!-- shared.js injects the navigation bar and the sign-in gate above #pageRoot -->
  <div class="app-container">

    <!-- What this element does: Main curation workspace container, locked by default until Firebase auth resolves -->
    <!-- What it brings: Prevents any visual flash or leakage of input panels while the user is logging in -->
    <!-- Where changes can be seen: On the upload dashboard page prior to signing in -->
    <main id="pageRoot" class="main-content is-auth-hidden" style="display:none !important">

      <!-- ================================================================
           LEFT: JSON input and the metadata applied across the batch
           ================================================================ -->
      <section class="input-panel">
        <!-- Panel header with title and quick sample loading options -->
        <div class="panel-header">
          <h2 class="panel-title">Paste JSON Questions</h2>
          <!-- Header actions: load full sample or minimal 4-essential format -->
          <div class="header-sample-actions">
            <button id="sampleBtn" class="btn btn-sm btn-ghost" title="Load full APPSC question sample with all optional attributes">
              Full Sample
            </button>
            <button id="templateBtn" class="btn btn-sm btn-ghost" title="Load minimal JSON format with only the 4 required essentials: Subject, Question, Options, Answer">
              Minimal JSON
            </button>
          </div>
        </div>

        <!-- Target Subject: Primary selector, required if omitted inside JSON payload -->
        <div class="field-group hero-subject-group">
          <div class="label-with-pill">
            <label for="subjectSelect">Target Subject</label>
            <span class="pill-badge pill-required">Required if not in JSON</span>
          </div>
          <select id="subjectSelect" class="field-select hero-select"></select>
        </div>

        <!-- Batch Defaults (Compact 2-Column Grid to eliminate vertical scrolling) -->
        <div class="meta-section-compact">
          <div class="meta-section-header">
            <span class="meta-section-title">Batch Defaults</span>
            <span class="meta-section-sub">(Optional — auto-fills blank card fields)</span>
          </div>
          <div class="meta-grid-2col">
            <!-- Col 1: Default Date -->
            <div class="field-group-compact">
              <label for="defaultDate">Date</label>
              <input type="text" id="defaultDate" class="field-input-compact" placeholder="DD-MM-YYYY (e.g. 05-09-2026)">
            </div>
            <!-- Col 2: Default Newspaper -->
            <div class="field-group-compact">
              <label for="defaultNewspaper">Newspaper</label>
              <input type="text" id="defaultNewspaper" class="field-input-compact" placeholder="e.g. The Hindu">
            </div>
            <!-- Col 1: Default Difficulty -->
            <div class="field-group-compact">
              <label for="defaultDifficulty">Difficulty</label>
              <select id="defaultDifficulty" class="field-select-compact"></select>
            </div>
            <!-- Col 2: Default Status (defaults to Approved) -->
            <div class="field-group-compact">
              <label for="defaultStatus">Status</label>
              <select id="defaultStatus" class="field-select-compact"></select>
            </div>
            <!-- Col 1: Default Topic -->
            <div class="field-group-compact">
              <label for="defaultTopic">Topic</label>
              <input type="text" id="defaultTopic" class="field-input-compact" placeholder="e.g. Biodiversity">
            </div>
            <!-- Col 2: Default Tags -->
            <div class="field-group-compact">
              <label for="defaultTags">Tags</label>
              <input type="text" id="defaultTags" class="field-input-compact" placeholder="keywords, comma-separated">
            </div>
            <!-- Full width (span 2): Default Source URL -->
            <div class="field-group-compact grid-col-span-2">
              <label for="defaultSourceUrl">Source URL</label>
              <input type="text" id="defaultSourceUrl" class="field-input-compact" placeholder="https://… (optional reference link)">
            </div>
          </div>
        </div>

        <!-- JSON Input Textarea with explicit requirement header -->
        <div class="textarea-header">
          <label for="jsonInput">JSON Payload</label>
          <span class="textarea-requirement-hint">Must contain: <b>Subject, Question, Options, Answer</b></span>
        </div>
        <textarea id="jsonInput" class="json-textarea-compact" spellcheck="false"
                  placeholder='Paste JSON here. A question is added ONLY when it has Subject, Question, 4 Options, and Answer.

{
  "subject": "Environment",
  "questions": [
    {
      "question": "Which of the following is an autonomous body for green cover in Andhra Pradesh?",
      "option_a": "AP-Green",
      "option_b": "AP-Forest",
      "option_c": "AP-Eco",
      "option_d": "AP-Bio",
      "correct_answer": "A"
    }
  ]
}'></textarea>

        <!-- Action Buttons: Parse & Preview, Clear All -->
        <div class="action-buttons">
          <button id="parseBtn" class="btn btn-primary" title="Parse the JSON into editable cards (⌘+Enter)">
            🔍 Parse &amp; Preview
          </button>
          <button id="clearBtn" class="btn btn-ghost" title="Clear the input and all cards">
            Clear All
          </button>
        </div>

        <!-- Error display box for JSON syntax or missing mandatory fields -->
        <div id="parseError" class="error-box" style="display:none"></div>
      </section>

      <!-- ================================================================
           RIGHT: editable question cards
           ================================================================ -->
      <section class="cards-panel">
        <div class="cards-header">
          <div class="cards-header-info">
            <h2 class="panel-title">Question Cards <span id="cardCount" class="card-count">(0)</span></h2>
            <span class="panel-subtitle">Edit anything before sending &bull; click a radio to set the correct answer</span>
          </div>
          <div style="display:flex;gap:10px;align-items:center">
            <label class="hint-text" style="display:flex;align-items:center;gap:6px" title="Skip questions whose text already exists anywhere in the bank">
              <input type="checkbox" id="skipDuplicates" checked>
              Skip duplicates
            </label>
            <button id="sendToSheetBtn" class="btn btn-send" disabled title="Push all cards to the Google Sheets question bank">
              🚀 Send to Sheet
            </button>
          </div>
        </div>

        <!-- Bulk Actions Toolbar: Apply Difficulty, Status, or Batch Defaults across all cards simultaneously -->
        <div id="bulkToolbar" class="bulk-toolbar" style="display:none">
          <div class="bulk-toolbar-title">
            <span class="bulk-icon">⚡</span>
            <span>Bulk Apply:</span>
          </div>
          <div class="bulk-toolbar-controls">
            <!-- Bulk Difficulty Selector -->
            <div class="bulk-control-group">
              <label for="bulkDifficulty">Difficulty</label>
              <select id="bulkDifficulty" class="field-select-compact">
                <option value="">— Set all difficulty —</option>
                <option value="Easy">Easy</option>
                <option value="Medium">Medium</option>
                <option value="Hard">Hard</option>
              </select>
            </div>
            <!-- Bulk Status Selector -->
            <div class="bulk-control-group">
              <label for="bulkStatus">Status</label>
              <select id="bulkStatus" class="field-select-compact">
                <option value="">— Set all status —</option>
                <option value="Approved">Approved</option>
                <option value="Draft">Draft</option>
                <option value="Review">Review</option>
                <option value="Scheduled">Scheduled</option>
                <option value="Posted">Posted</option>
                <option value="Rejected">Rejected</option>
                <option value="Archived">Archived</option>
              </select>
            </div>
            <!-- Apply Left Defaults to All Cards Button -->
            <button id="applyDefaultsBtn" class="btn btn-sm btn-outline-cyan" title="Copy batch defaults from left panel to all cards">
              ⚡ Apply Defaults to All Cards
            </button>
          </div>
        </div>

        <!-- Container for individual editable question cards -->
        <div id="cardsContainer" class="cards-container vertical-flow"></div>
      </section>

    </main>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
